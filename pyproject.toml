[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seurats-hoard"
version = "0.1.0"
description = "Voxel studio: a 3D voxel editor, pictures and sprites to voxel models (instant builders or a language model that reviews its own renders), and .vox, GLB, STL and PNG sprite exports, with an MCP bridge."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Luissalet" }]
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7", "httpx>=0.27", "mcp>=1.10,<2", "pillow>=10", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
seurats-hoard = "seurat_hoard.__main__:main"

[tool.setuptools.packages.find]
include = ["seurat_hoard*"]

[tool.setuptools.package-data]
seurat_hoard = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
